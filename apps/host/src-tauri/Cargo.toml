[package]
name = "prysmview-host"
version = "2.0.0"
description = "PrysmView Host - Software de acesso remoto"
authors = ["PrysmView Team"]
license = "MIT OR Apache-2.0"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2.1"
zeroize = "1.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
