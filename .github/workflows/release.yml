name: Release

on:
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Web Frontend
        run: |
          npm install
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a54c7fe9363c9033d2732179678318b53d3960c2 # stable
        with:
          toolchain: stable

      - name: Check and Build Native Desktop
        shell: pwsh
        run: |
          if (Test-Path "src-tauri\Cargo.toml") {
            cargo build --manifest-path src-tauri\Cargo.toml --release
          } elseif (Test-Path "Cargo.toml") {
            cargo build --release
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Package installers (Inno Setup 6)
        shell: pwsh
        run: |
          if (Test-Path "installer\prysm-host.iss") {
            ISCC.exe installer\prysm-host.iss
          }
          if (Test-Path "installer\prysm-admin.iss") {
            ISCC.exe installer\prysm-admin.iss
          }

      - name: Publish release assets
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.2.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            Releases/*.msi
          generate_release_notes: true
