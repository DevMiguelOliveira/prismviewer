name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Validate (Frontend + Desktop)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate Web Frontend
        run: |
          npm install
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Validate Desktop (Tauri)
        shell: pwsh
        run: |
          if (Test-Path "src-tauri\Cargo.toml") {
            Write-Host "Validando compilacao do Rust em src-tauri..."
            cargo check --manifest-path src-tauri\Cargo.toml
          } else {
            Write-Host "Frontend validado com sucesso."
          }
