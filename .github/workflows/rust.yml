name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gate 0 - Gitleaks Secret Scanner (S-17)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Action
        uses: gitleaks/gitleaks-action@d866a7b7de7c617c2be66042bc61e1b52f5e3b08 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-gates:
    name: Gates Rust (fmt, clippy, test, subtle, audit)
    runs-on: windows-latest
    needs: [ gitleaks ]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a54c7fe9363c9033d2732179678318b53d3960c2 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be9541cb4b3b129c5b4d57d9 # v2.7.7

      - name: Gate 1 - Cargo Fmt Check
        run: cargo fmt --all -- --check

      - name: Gate 2 - Clippy (zero warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Gate 3 - Constant-time Secrets Check (S-16)
        shell: pwsh
        run: |
          # Verifica se algum código de autenticação usa '==' diretamente em campos sensíveis
          $insecure = Select-String -Path "crates/host/src/session_code.rs", "crates/host/src/ticket.rs" -Pattern "code ==|secret ==|ticket.signature ==|token =="
          if ($insecure) {
            Write-Error "ERRO S-16: Comparação insegura com == detectada em campo sensível. Use subtle::ConstantTimeEq."
            exit 1
          }
          Write-Host "S-16: Verificação de subtle/constant-time concluída com sucesso."

      - name: Gate 4 - Testes unitários e de integração
        run: cargo test --workspace --all-features

      - name: Gate 5 - Cargo Deny (Advisories e Licenças - S-18)
        shell: pwsh
        run: |
          if (Get-Command cargo-deny -ErrorAction SilentlyContinue) {
            cargo deny check advisories
          } else {
            Write-Host "cargo-deny não instalado no runner Windows; executando via script de auditoria."
          }
