name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  go-gates:
    name: Gates Go (gofmt, vet, test, govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Gate 1 - Gofmt Check
        working-directory: server
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Arquivos Go mal formatados:"
            gofmt -l .
            exit 1
          fi

      - name: Gate 2 - Go Vet
        working-directory: server
        run: go vet ./...

      - name: Gate 3 - Go Test
        working-directory: server
        run: go test -v ./...

      - name: Gate 4 - Govulncheck (S-18)
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
