# ==============================================================================
# PrysmView - Configuração de Retenção de Logs do systemd-journald (O-03)
# Limite máximo de 500 MB e retenção de 30 dias para evitar esgotamento de disco.
# Instalar em: /etc/systemd/journald.conf.d/prysmview.conf
# ==============================================================================
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M
MaxRetentionSec=30day
MaxFileSec=7day
